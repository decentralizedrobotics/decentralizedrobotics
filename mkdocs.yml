site_name: Decentralized Robotics
site_author: Ranch Hand Robotics LLC
site_description: Robots and people, connected beyond the grid. Open tools, interfaces, and networking for traditional and mesh networks.
repo_url: https://github.com/decentralizedrobotics/decentralizedrobotics
edit_uri: edit/main/docs/
nav:
  - Home: index.md
  - Getting Started: 
    - Concepts: GettingStarted/Concepts.md
    - Robot: GettingStarted/Robot.md
    - Operator: GettingStarted/Operator.md
  - About: 
    - Background: About/Background.md
    - Support: About/Support.md
  - Other Topics:
    - 'Quick SSH Access': Other/Quick-SSH-Access.md
  - Developer:
    - 'Developer Guide': Developer/Guide.md

# Theme
theme:
  name: material
  custom_dir: overrides
  logo: assets/dero-mark.svg
  favicon: assets/dero-mark.svg
  font: false
  features:
    - navigation.sections
    - content.tabs.link
  palette:
    - scheme: slate
      primary: custom
      accent: custom
extra_css:
  - stylesheets/extra.css
watch:
  - overrides
  - .mailmap
extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/rh_robotics
      name: Ranch Hand Robotics LLC on X (@rh_robotics)

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
  - footnotes
use_directory_urls: false
strict: false
plugins:
  - search
  - macros
  - git-authors
  - mkdocs-video